# PR gate — typecheck, smoke, dashboard metrics, coverage ratchet
#
# Live tests need network to clinical.dev2 and the internal API gateway.
# If GitHub-hosted runners cannot reach *.internal.*, set repo variable
# CLINICAL_RUNNER to a self-hosted label (decision D13).
name: PR gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  static:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  smoke:
    name: Smoke against dev2
    needs: static
    runs-on: ${{ vars.CLINICAL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Read-only: a PR reads the nightly trend for context but never writes to
      # it, so a short smoke run cannot enter the published history (D19).
      - name: Restore dashboard history
        continue-on-error: true
        run: npm run dashboard:restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_HISTORY_URL: https://masudrana-bit.github.io/Rethink-Clinical-test-suite/history.json
      - name: Smoke (excludes @write @bug @visual @wip)
        run: npm run test:smoke
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
      - name: Generate dashboard metrics after the run
        if: always()
        continue-on-error: true
        run: npm run dashboard:metrics
      - name: Coverage ratchet reads dashboard metrics
        if: always()
        run: npm run coverage:ratchet
      - name: Scrubbing guard
        if: always()
        run: npm run verify:scrub
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
      - name: Generate detailed test evidence
        if: always()
        continue-on-error: true
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-reports
          path: |
            reports/
            docs/surface-inventory.md
            docs/api-endpoint-report.md
            allure-report/
          if-no-files-found: ignore
          retention-days: 14
